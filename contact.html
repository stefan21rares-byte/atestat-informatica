    <div class="progress-container">
        <div class="progress-bar" id="baraProgres"></div>

    <main>
        <section id="contact">
            <h2>Contactează-mă</h2>
            <div class="card">
                <form id="formular-contact" class="form-contact">
                    <input type="text" id="nume" placeholder="Numele tău" required>
                    <input type="email" id="email" placeholder="Adresa ta de email" required>
                    <textarea id="mesaj" rows="5" placeholder="Scrie mesajul tău aici..." required></textarea>
                    <button type="submit" class="buton-trimite">Trimite Mesajul</button>
                </form>
                <div id="mesaj-succes" style="display: none; text-align: center; color: #28a745; margin-top: 15px; font-weight: bold;">
                    Mesajul a fost trimis cu succes!
                </div>
            </div>
        </section>
    </main>
